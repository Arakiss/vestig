version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "oven-sh/*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
    groups:
      docs-runtime:
        patterns:
          - "shiki"
          - "@shikijs/*"
          - "@mdx-js/*"
          - "@next/mdx"
      next-runtime:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
