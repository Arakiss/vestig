# =============================================================================
# Vestig Release Pipeline
# =============================================================================
# Validates release candidates on push and publishes from manual dispatch.
# Manual publishing keeps changelog quality and npm Trusted Publisher state explicit.
#
# Commit Types:
#   feat: → MINOR version bump (0.17.0 → 0.18.0)
#   fix:  → PATCH version bump (0.17.0 → 0.17.1)
#   perf: → PATCH version bump
#   feat!: → MINOR bump while on 0.x.x (major_on_zero=false)
#
# NOTE: v1.0.0 requires manual release (major bumps disabled in 0.x.x)
#
# Other types (docs, style, refactor, test, build, ci, chore) don't bump version
# =============================================================================

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force version bump (leave empty for auto)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  id-token: write
  pull-requests: write

env:
  BUN_VERSION: 'latest'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===========================================================================
  # Vestig Release
  # ===========================================================================
  release:
    name: Vestig Release
    runs-on: ubuntu-latest
    # Only run on main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first - required for typecheck to resolve workspace dependencies
      - name: Build packages
        run: bun run build

      - name: Validate package contents
        run: bun run validate:package-contents

      - name: Run type checking
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # =========================================================================
      # Analyze commits and determine version bump
      # =========================================================================
      - name: Analyze commits for version bump
        id: analyze
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          # Get commits since last tag
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          echo "Commits since $LAST_TAG:"
          echo "$COMMITS"

          # Determine version bump type based on conventional commits
          BUMP_TYPE=""

          # Check for breaking changes (feat!:, fix!:, etc.)
          if echo "$COMMITS" | grep -qE "^[a-z]+!:"; then
            # While on 0.x.x, breaking changes bump minor (not major)
            BUMP_TYPE="minor"
            echo "Breaking change detected (bumping minor while on 0.x.x)"
          # Check for features
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP_TYPE="minor"
            echo "Feature detected"
          # Check for fixes/perf
          elif echo "$COMMITS" | grep -qE "^(fix|perf)(\(.+\))?:"; then
            BUMP_TYPE="patch"
            echo "Fix/perf detected"
          else
            echo "No version-bumping commits found"
          fi

          # Override with manual input if provided
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            BUMP_TYPE="${{ github.event.inputs.force_version }}"
            echo "Manual override: $BUMP_TYPE"
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

          if [ -z "$BUMP_TYPE" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      # =========================================================================
      # Skip if no release needed
      # =========================================================================
      - name: Skip release
        if: steps.analyze.outputs.should_release == 'false'
        run: |
          echo "No version-bumping commits found. Skipping release."
          echo "## Release Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No version-bumping commits found since last release." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit types that trigger releases:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`feat:\` → Minor version bump" >> $GITHUB_STEP_SUMMARY
          echo "- \`fix:\` → Patch version bump" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf:\` → Patch version bump" >> $GITHUB_STEP_SUMMARY
          echo "- \`feat!:\` or \`fix!:\` → Minor bump (breaking change)" >> $GITHUB_STEP_SUMMARY

      # =========================================================================
      - name: Release requires manual dispatch
        if: steps.analyze.outputs.should_release == 'true' && github.event_name == 'push'
        run: |
          echo "Release candidate detected: ${{ steps.analyze.outputs.bump_type }}"
          echo "Publishing is intentionally manual so changelog quality, npm provenance, and package-level Trusted Publisher state are reviewed before creating tags."
          echo "## Release Candidate Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Detected bump:** ${{ steps.analyze.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run this workflow manually with \`dry_run=false\` when npm Trusted Publisher permissions are ready for both \`vestig\` and \`@vestig/next\`." >> $GITHUB_STEP_SUMMARY

      # =========================================================================
      # Create Release (Dry Run)
      # =========================================================================
      - name: Release (Dry Run)
        if: steps.analyze.outputs.should_release == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          echo "DRY RUN - No changes will be made"
          bun run release -- --ci --dry-run --increment=${{ steps.analyze.outputs.bump_type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # Prepare Release
      # =========================================================================
      - name: Prepare Release
        id: release
        if: steps.analyze.outputs.should_release == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'
        run: |
          echo "Preparing ${{ steps.analyze.outputs.bump_type }} release locally..."
          bun run release -- --ci --increment=${{ steps.analyze.outputs.bump_type }} --stage=prepare

          # Get the new version
          VERSION=$(node -p "require('./packages/vestig/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "released=true" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # Publish to npm
      # =========================================================================
      - name: Setup Node.js for npm publish
        if: steps.release.outputs.released == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Resolve workspace:* references to actual versions before publishing
      # npm publish does NOT handle the workspace: protocol
      - name: Resolve workspace references
        if: steps.release.outputs.released == 'true'
        run: |
          VERSION=${{ steps.release.outputs.version }}
          echo "Resolving workspace:* to version $VERSION"

          # Update @vestig/next to use the actual vestig version
          cd packages/vestig-next
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.dependencies && pkg.dependencies.vestig === 'workspace:*') {
              pkg.dependencies.vestig = '$VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
              console.log('✅ Updated vestig dependency to $VERSION');
            }
          "

      - name: Publish @vestig/next to npm
        id: npm_vestig_next
        if: steps.release.outputs.released == 'true'
        run: |
          cd packages/vestig-next
          npm publish --provenance --access public
          echo "Published @vestig/next@${{ steps.release.outputs.version }} to npm"

      - name: Publish vestig to npm
        id: npm_vestig
        if: steps.release.outputs.released == 'true'
        run: |
          cd packages/vestig
          npm publish --provenance --access public
          echo "Published vestig@${{ steps.release.outputs.version }} to npm"

      - name: Restore workspace references
        if: steps.release.outputs.released == 'true'
        run: git checkout -- packages/vestig-next/package.json

      - name: Finalize Release
        if: steps.release.outputs.released == 'true'
        run: |
          echo "Finalizing ${{ steps.release.outputs.tag }} after npm publication..."
          bun run release -- --ci --increment=${{ steps.analyze.outputs.bump_type }} --stage=finalize

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      bump_type: ${{ steps.analyze.outputs.bump_type }}

  # ===========================================================================
  # Post-Release Summary
  # ===========================================================================
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'

    steps:
      - name: Create Summary
        run: |
          echo "## 🚀 Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ needs.release.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ What happened:" >> $GITHUB_STEP_SUMMARY
          echo "- Version bumped in package.json" >> $GITHUB_STEP_SUMMARY
          echo "- CHANGELOG.md updated with conventional commits" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Published \`@vestig/next@${{ needs.release.outputs.version }}\` to npm" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Published \`vestig@${{ needs.release.outputs.version }}\` to npm" >> $GITHUB_STEP_SUMMARY
          echo "- Git tag ${{ needs.release.outputs.tag }} created" >> $GITHUB_STEP_SUMMARY
          echo "- Changes pushed to main" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📚 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
          echo "- [vestig on npm](https://www.npmjs.com/package/vestig)" >> $GITHUB_STEP_SUMMARY
          echo "- [@vestig/next on npm](https://www.npmjs.com/package/@vestig/next)" >> $GITHUB_STEP_SUMMARY
