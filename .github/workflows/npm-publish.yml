# =============================================================================
# Manual npm Publish
# =============================================================================
# For publishing packages when the automatic release workflow fails
# or to republish after fixing issues
# =============================================================================

name: npm Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - 'all'
          - 'vestig'
          - '@vestig/next'
      dry_run:
        description: 'Dry run (show what would be published)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  BUN_VERSION: '1.3.14'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Validate package contents
        run: bun run validate:package-contents

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Get versions
        id: versions
        run: |
          VESTIG_VERSION=$(node -p "require('./packages/vestig/package.json').version")
          VESTIG_NEXT_VERSION=$(node -p "require('./packages/vestig-next/package.json').version")
          echo "vestig_version=$VESTIG_VERSION" >> $GITHUB_OUTPUT
          echo "vestig_next_version=$VESTIG_NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Publishing vestig@$VESTIG_VERSION and @vestig/next@$VESTIG_NEXT_VERSION"

      # Resolve workspace:* references to actual versions before publishing
      # npm publish does NOT handle the workspace: protocol
      - name: Resolve workspace references
        run: |
          VERSION=${{ steps.versions.outputs.vestig_version }}
          echo "Resolving workspace:* to version $VERSION"

          # vestig is a devDependency here, not a runtime one: it must stay out
          # of dependencies so package managers never install a nested copy.
          # npm still ships the devDependencies block in the published manifest,
          # so the workspace: protocol has to be resolved there too.
          cd packages/vestig-next
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            let changed = false;
            for (const field of ['dependencies', 'devDependencies']) {
              const deps = pkg[field];
              if (!deps) continue;
              for (const [name, range] of Object.entries(deps)) {
                if (typeof range === 'string' && range.startsWith('workspace:')) {
                  deps[name] = '$VERSION';
                  changed = true;
                  console.log('Resolved ' + field + '.' + name + ' to $VERSION');
                }
              }
            }
            if (changed) fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
            if (pkg.dependencies && pkg.dependencies.vestig) {
              console.error('vestig must not be a runtime dependency of @vestig/next');
              process.exit(1);
            }
          "

      - name: Publish vestig (dry run)
        if: inputs.dry_run == true && (inputs.package == 'vestig' || inputs.package == 'all')
        run: |
          cd packages/vestig
          npm publish --provenance --access public --dry-run
          echo "Would publish vestig@${{ steps.versions.outputs.vestig_version }}"

      - name: Publish @vestig/next (dry run)
        if: inputs.dry_run == true && (inputs.package == '@vestig/next' || inputs.package == 'all')
        run: |
          cd packages/vestig-next
          npm publish --provenance --access public --dry-run
          echo "Would publish @vestig/next@${{ steps.versions.outputs.vestig_next_version }}"

      # Core first: @vestig/next declares vestig as a peer at the version they
      # ship together, so publishing the integration first leaves a window where
      # installing it resolves a peer that does not exist yet.
      - name: Publish vestig
        if: inputs.dry_run != true && (inputs.package == 'vestig' || inputs.package == 'all')
        run: |
          cd packages/vestig
          npm publish --provenance --access public
          echo "✅ Published vestig@${{ steps.versions.outputs.vestig_version }}"

      - name: Publish @vestig/next
        if: inputs.dry_run != true && (inputs.package == '@vestig/next' || inputs.package == 'all')
        run: |
          cd packages/vestig-next
          npm publish --provenance --access public
          echo "✅ Published @vestig/next@${{ steps.versions.outputs.vestig_next_version }}"

      - name: Summary
        run: |
          echo "## 📦 npm Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "**Mode:** Dry run (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** Published" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.package }}" == "vestig" ] || [ "${{ inputs.package }}" == "all" ]; then
            echo "| vestig | ${{ steps.versions.outputs.vestig_version }} |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.package }}" == "@vestig/next" ] || [ "${{ inputs.package }}" == "all" ]; then
            echo "| @vestig/next | ${{ steps.versions.outputs.vestig_next_version }} |" >> $GITHUB_STEP_SUMMARY
          fi
